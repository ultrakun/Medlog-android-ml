name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/camera@7
          npx cap init "服薬ノート" com.medlog.app --web-dir www
          npx cap add android
          unzip -q -o icon3.zip -d icon
          RES=android/app/src/main/res
          find $RES -name 'ic_launcher*' -delete
          cp -r icon/mipmap-* $RES/
          cp icon/ic_launcher_foreground.png icon/ic_launcher_background.png $RES/mipmap-xxxhdpi/
          mkdir -p $RES/mipmap-anydpi-v26
          for n in ic_launcher ic_launcher_round; do
          cat > $RES/mipmap-anydpi-v26/$n.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@mipmap/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          done
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: medlog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -o 'Version 0\.[0-9]*' index.html | head -1 | sed 's/Version //')
          cp android/app/build/outputs/apk/debug/app-debug.apk medlog-v$VER.apk
          gh release create "v$VER-${{ github.run_number }}" "medlog-v$VER.apk" --title "Medlog v$VER" --notes "Android APK (debug build)"
