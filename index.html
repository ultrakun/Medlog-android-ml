<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>服薬ノート</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1d2330;--sub:#6b7280;--ac:#2f6fed;--ln:#e3e6ec;--dg:#d9363e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--card:#1a1d24;--tx:#eef0f4;--sub:#9aa1ae;--ac:#6c9bff;--ln:#2a2f3a;--dg:#ff6b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--card:#1a1d24;--tx:#eef0f4;--sub:#9aa1ae;--ac:#6c9bff;--ln:#2a2f3a;--dg:#ff6b72;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{zoom:var(--ui-zoom,1);margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
main{max-width:560px;margin:0 auto;padding:12px 14px}
h2{font-size:20px;margin:8px 2px 12px}h3{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.g{flex:1;min-width:0}
.sub{color:var(--sub);font-size:13px}
.btns{display:flex;gap:8px;margin-top:12px}
.big{flex:1;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:18px}
.big.dg{background:var(--dg)}
.ghost{background:transparent;border:1px solid var(--ln);border-radius:12px;padding:10px 12px}
.wide{width:100%;margin-top:4px}
.ic{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.settings-close{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:12px;z-index:20;background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.12);min-width:76px;font-weight:700}.settings-page{padding-top:56px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:12px 4px;color:var(--sub);font-weight:600}
nav button.on{color:var(--ac)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:6px 12px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
td,th{padding:4px 2px;border-bottom:1px solid var(--ln)}th{color:var(--sub);font-weight:500}
td:first-child,th:first-child{text-align:left;white-space:nowrap}
.wk{display:flex}
.wn{flex:1;min-width:0;padding-right:6px}
.wnh{height:36px;border-bottom:1px solid var(--ln)}
.wr{height:30px;line-height:30px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--ln)}
.wk .tw{flex:1;min-width:0;overflow-x:auto}
#wk{width:calc(31*var(--cw,32px))}
.wrow{display:flex;align-items:center;height:30px;border-bottom:1px solid var(--ln)}
.wrow.wh{height:36px;color:var(--sub);font-size:12px;line-height:1.2}
.wrow span{flex:none;width:var(--cw,32px);text-align:center}
.wrow em{font-style:normal}
.wrow i.dot{font-style:normal;min-width:18px;height:18px;line-height:18px;border-radius:9px;font-size:11px}
.dot{display:inline-block;min-width:22px;height:22px;line-height:22px;border-radius:11px;font-weight:700;font-size:12px;color:#111;border:1px solid rgba(0,0,0,.2)}
.dh{display:flex;justify-content:space-between;margin:16px 2px 6px;font-weight:700}
.lr{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln)}
.lr:first-child{border-top:0}
.mini{font-size:13px;padding:6px 9px;border-radius:9px}
.med-item{display:grid;grid-template-columns:1fr;gap:5px;padding:10px 12px}
.med-name{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;min-width:0;font-weight:700}
.med-props{font-size:12px;color:var(--sub);font-weight:400;overflow-wrap:anywhere}
.med-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.med-actions button{width:100%;min-width:0;padding:7px 3px;font-size:13px}
.t{font-weight:700;font-variant-numeric:tabular-nums}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
label{display:block;font-size:13px;color:var(--sub)}label input{margin-top:4px}
.lbl{font-size:13px;color:var(--sub);margin:12px 0 4px}
.opts{display:flex;gap:8px}
.opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:2px solid var(--ln);background:none;border-radius:12px}
.opt.on{border-color:var(--ac)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.s{width:34px;height:34px;border-radius:50%;border:2px solid var(--ln)}
.s.on{outline:3px solid var(--ac);outline-offset:1px}
.rgb{display:flex;gap:6px;align-items:center;margin-top:10px}
.rgb input[type=color]{width:46px;height:42px;padding:2px;flex:none}
.rgb input[type=number]{padding:8px 4px;text-align:center}
#toast{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:#222a38;color:#fff;border-radius:12px;padding:10px 14px;display:none;align-items:center;gap:10px;z-index:5}
#toast button{background:none;border:0;color:#9db9ff;font-weight:700}
.mr{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--ln)}
.mr:first-child{border-top:0}
.mr b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.take{flex:none;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:700}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.cr{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--ln);font-size:14px;cursor:pointer}
.cr:first-child{border-top:0}
.cr .g{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--ln);background:var(--card);border-radius:16px;padding:3px 9px 3px 5px;font-size:13px}
.empty{text-align:center;color:var(--sub);padding:40px 10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 6px;font-size:16px}
.cal-h button:disabled{opacity:.3}
.cal-t{background:none;border:0;font:inherit;font-weight:700;padding:6px 14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cw{text-align:center;font-size:12px;color:var(--sub)}
.cd{font:inherit;font-size:13px;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:4px 1px;aspect-ratio:1/1.1;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;width:auto}
.cd.sel{border:2px solid var(--ac)}
.cd.td{background:var(--ln);color:var(--ac)}
.cds{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:100%;line-height:0}
.cds i{display:block;width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.3)}
.cdot{flex:none;display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.3)}
#appname{position:fixed;top:calc(env(safe-area-inset-top,0px) + 3px);right:10px;z-index:4;font-size:10px;line-height:1.2;color:var(--sub);opacity:.85;pointer-events:none;white-space:nowrap}
</style></head>

<dialog id="dlg"></dialog>

function parseCSV(t){
 const rows=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===","){r.push(f);f=""}
  else if(c==="\n"){r.push(f);rows.push(r);r=[];f=""}
  else if(c!=="\r")f+=c}
 if(f!==""||r.length){r.push(f);rows.push(r)}
 return rows.filter(x=>x.some(v=>v!==""))}

 if(!meds.length&&!logs.length)throw new Error("invalid");

function medForm(){const d=draft;

function cdraw(c,sz){const {im,z,x,y}=crop,s=260/Math.min(im.width,im.height)*z,k=sz/260,w=im.width*s,h=im.height*s,g=c.getContext("2d");g.fillStyle="#000";g.fillRect(0,0,sz,sz);g.drawImage(im,((260-w)/2+x)*k,((260-h)/2+y)*k,w*k,h*k)}
function cshow(){const {im}=crop,s=260/Math.min(im.width,im.height)*crop.z,mx=Math.max(0,(im.width*s-260)/2),my=Math.max(0,(im.height*s-260)/2);crop.x=Math.max(-mx,Math.min(mx,crop.x));crop.y=Math.max(-my,Math.min(my,crop.y));cdraw($("#cv"),260)}
function openCrop(im){grab();crop={im,z:1,x:0,y:0};
 show(`<h3>${T("写真を切り抜く")}</h3><canvas id="cv" width="260" height="260" style="width:260px;height:260px;touch-action:none;border-radius:12px;display:block;margin:0 auto"></canvas><div class="sub" style="text-align:center;margin:6px 0">${T("ドラッグで移動・スライダーやピンチで拡大")}</div><input type="range" id="zm" min="1" max="4" step="0.01" value="1" style="padding:0"><div class="btns"><button class="ghost" data-a="cropno">${T("キャンセル")}</button><button class="big" data-a="cropok">${T("決定")}</button></div>`);
 const cv=$("#cv"),P=new Map();let ld=0;
 cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.clientX,e.clientY]);ld=0};
 cv.onpointermove=e=>{const p=P.get(e.pointerId);if(!p)return;if(P.size===1){crop.x+=e.clientX-p[0];crop.y+=e.clientY-p[1]}P.set(e.pointerId,[e.clientX,e.clientY]);if(P.size===2){const [a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(ld)crop.z=Math.max(1,Math.min(4,crop.z*d/ld));ld=d;$("#zm").value=crop.z}cshow()};

const dtForm=(title,v,a,id)=>show(`<h3>${title}</h3><label>${T("日時")}<input type="datetime-local" id="dt" value="${v}" max="${loc(Date.now())}"></label><div class="btns"><button class="ghost" data-a="close">${T("キャンセル")}</button><button class="big" data-a="${a}" data-id="${id}">${T("決定")}</button></div>`);

document.addEventListener("click",e=>{

  else if(a==="resetlogs")ask(T("飲んだ記録を全て削除します。この操作は元に戻せません。よろしいですか?"),()=>setTimeout(()=>ask(T("本当によろしいですか？"),()=>{S.logs=[];save();lastId=null;$("#toast").style.display="none";render();alert(T("飲んだ記録を全て削除しました。"))}),0))

 else if(a==="setret"){if(id===RET)return;const lim=retLim(id),n=lim?S.logs.filter(l=>l.t<lim).length:0,go=()=>{RET=id;try{localStorage.setItem("medlog_retention",RET)}catch(e){}render()};if(n)ask(fmt("%1件の古い記録が削除されます。よろしいですか?",n),go);else go()}

 else if(a==="editlog"){const l=S.logs.find(x=>x.id===id);if(l)dtForm(T("日時を変更"),loc(l.t),"editok",id)}
 else if(a==="editok"){const t=new Date($("#dt").value).getTime(),l=S.logs.find(x=>x.id===id);if(isNaN(t)||!l)return;if(t>Date.now()){alert(T("未来の日時は指定できません。"));return}l.t=t;save();D.close();render()}
 else if(a==="dellog"){const l=S.logs.find(x=>x.id===id);if(l)ask(fmt("%1(%2 %3)の記録を消しますか?",esc(l.n),ds(l.t),hm(l.t)),()=>{S.logs=S.logs.filter(x=>x.id!==id);save();render()})}
 else if(a==="logact"){const l=S.logs.find(x=>x.id===id);if(l)show(`<h3>${esc(medOf(l).n)}</h3><p class="sub">${ds(l.t)} ${hm(l.t)}</p><div class="btns"><button class="ghost" data-a="editlog" data-id="${id}">${T("日時変更")}</button><button class="ghost" data-a="dellog" data-id="${id}">${T("消す")}</button></div><div class="btns"><button class="ghost" data-a="close" style="flex:1">${T("閉じる")}</button></div>`)}

 else if(a==="exportbackup"){try{const csv=backupFmt==="csv";const pack={app:"medlog",formatVersion:1,exportedAt:new Date().toISOString(),meds:S.meds,logs:S.logs};const blob=csv?new Blob([toCSV()],{type:"text/csv;charset=utf-8"}):new Blob([JSON.stringify(pack,null,2)],{type:"application/json;charset=utf-8"});const now=new Date(),stamp=dk(now).replace(/-/g,"")+p2(now.getHours())+p2(now.getMinutes())+p2(now.getSeconds());const name="medlog_backup_"+stamp+(csv?".csv":".json");const CAP=window.Capacitor;if(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()){const PL=CAP.Plugins||{},call=(p,m,o)=>PL[p]&&PL[p][m]?PL[p][m](o):CAP.nativePromise(p,m,o);call("Filesystem","writeFile",{path:name,data:csv?toCSV():JSON.stringify(pack,null,2),directory:"CACHE",encoding:"utf8"}).then(r=>call("Share","share",{title:name,files:[r.uri]})).catch(x=>{if(!/cancel/i.test(String(x&&(x.message||x))))alert(T("バックアップファイルを作成できませんでした。ブラウザで開いているか、端末の空き容量をご確認ください。"))});return}const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download=name;link.style.display="none";document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);alert(fmt("バックアップファイルを作成しました。\n\nファイル名: %1\n\nAndroidの「ダウンロード」フォルダに保存されます。",name))}catch(x){alert(T("バックアップファイルを作成できませんでした。ブラウザで開いているか、端末の空き容量をご確認ください。"))}}
